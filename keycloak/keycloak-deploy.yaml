apiVersion: apps/v1
kind: Deployment

metadata:
  name: keycloak
  namespace: nok-base

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
      - name: keycloak

        image: ghcr.io/cspdevlabs/nok-portal-auth-keycloak:v1.0.0
        imagePullPolicy: Always

        args:
        - start-dev
        - --import-realm
        - --http-relative-path=/auth
        - --proxy-headers=xforwarded

        ports:
        - containerPort: 8080

        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN

        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        
        - name: KC_DB
          value: postgres

        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-postgres:5432/keycloak

        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-postgres-secret
              key: POSTGRES_USER

        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-postgres-secret
              key: POSTGRES_PASSWORD

        - name: KC_HTTP_ENABLED
          value: "true"

        # Full URL (with /auth path) so login form actions include :8080 (KinD port-forward).
        - name: KC_HOSTNAME
          value: http://bng.nok.local:8080/auth

        - name: KC_HOSTNAME_ADMIN
          value: http://bng.nok.local:8080/auth

        - name: KC_HOSTNAME_STRICT
          value: "false"

        - name: KC_HTTP_RELATIVE_PATH
          value: /auth

        - name: KC_PROXY_HEADERS
          value: xforwarded

        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true

      volumes:
      - name: realm-import
        configMap:
          name: keycloak-realm