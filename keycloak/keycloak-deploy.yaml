apiVersion: apps/v1
kind: Deployment

metadata:
  name: keycloak
  namespace: nok-bng

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
      - name: keycloak

        image: keycloak:v2
        imagePullPolicy: Never

        args:
        - start-dev
        - --import-realm

        ports:
        - containerPort: 8080

        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN

        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        
        - name: KC_DB
          value: postgres

        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-postgres:5432/keycloak

        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-postgres-secret
              key: POSTGRES_USER

        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-postgres-secret
              key: POSTGRES_PASSWORD

        - name: KC_HOSTNAME
          value: http://keycloak.nok.local:8080

        - name: KC_HTTP_ENABLED
          value: "true"

        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true

      volumes:
      - name: realm-import
        configMap:
          name: keycloak-realm