apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: nok-bng

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oauth2-proxy

  template:
    metadata:
      labels:
        app: oauth2-proxy

    spec:
      containers:
      - name: oauth2-proxy

        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1

        args:
        - --provider=keycloak-oidc

        - --http-address=0.0.0.0:4180

        - --oidc-issuer-url=http://keycloak.nok.local:8080/realms/netopskube

        - --backend-logout-url=http://keycloak.nok.local:8080/realms/netopskube/protocol/openid-connect/logout?id_token_hint={id_token}

        - --client-id=nok-portal

        - --client-secret=$(CLIENT_SECRET)

        - --cookie-secret=$(COOKIE_SECRET)

        - --cookie-secure=false

        - --email-domain=*

        - --insecure-oidc-allow-unverified-email=true

        - --upstream=static://200

        - --reverse-proxy=true

        env:
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-secret

        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: cookie-secret

        ports:
        - containerPort: 4180
